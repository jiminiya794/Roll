<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>데굴데굴</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5efe4; }
    canvas { display: block; width: 100%; height: 100%; cursor: none; }
    .hint { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); color: #61594e; font: 500 13px/1.3 system-ui, sans-serif; letter-spacing: .08em; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="art" aria-label="마우스와 부딪히면 아야 하고 멈추는 구르는 사람 미디어 아트"></canvas>
  <div class="hint">사람에게 마우스를 가까이 가져가 보세요</div>
  <script>
    const canvas = document.getElementById('art');
    const ctx = canvas.getContext('2d');
    const pointer = { x: -1000, y: -1000, active: false };
    const people = Array.from({ length: 100 }, (_, i) => ({
      x: 0, y: 0, r: 19 + (i % 4) * 3,
      vx: (i % 2 ? -1 : 1) * (1.1 + (i % 6) * .16),
      vy: (i % 3 - 1) * .7 + .9, angle: i * .7, pausedUntil: 0,
      startled: 0, lastHit: 0, lastBump: 0, speechUntil: 0, speech: '', hair: i % 5,
      color: `hsl(${Math.round(i * 360 / 100)} 68% 57%)`
    }));
    let width = 0, height = 0, ratio = 1, last = performance.now();

    function resize() {
      ratio = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth; height = innerHeight;
      canvas.width = width * ratio; canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      const columns = Math.max(4, Math.floor(width / 94));
      const rows = Math.ceil(people.length / columns);
      people.forEach((person, i) => {
        person.x = ((i % columns) + .5) * width / columns;
        person.y = (Math.floor(i / columns) + .5) * height / rows;
      });
    }
    addEventListener('resize', resize); resize();
    addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
    addEventListener('pointerleave', () => pointer.active = false);

    function hit(person, now) {
      if (!pointer.active || now < person.pausedUntil || now - person.lastHit < 1050) return;
      const dx = pointer.x - person.x, dy = pointer.y - person.y;
      if (Math.hypot(dx, dy) < person.r + 15) {
        person.lastHit = now;
        person.pausedUntil = now + 820;
        person.speechUntil = now + 820;
        person.speech = '아야.';
        person.startled = 1;
        const d = Math.max(1, Math.hypot(dx, dy));
        person.vx = -dx / d * (1.75 + Math.random() * .55);
        person.vy = -dy / d * (1.35 + Math.random() * .55);
      }
    }
    function collidePeople(now) {
      for (let i = 0; i < people.length; i++) {
        for (let j = i + 1; j < people.length; j++) {
          const a = people[i], b = people[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          let distance = Math.hypot(dx, dy);
          const minimum = a.r + b.r;
          if (distance >= minimum) continue;
          if (distance < .01) { dx = 1; dy = 0; distance = 1; }
          const nx = dx / distance, ny = dy / distance;
          const overlap = minimum - distance;
          a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
          b.x += nx * overlap / 2; b.y += ny * overlap / 2;
          const relativeSpeed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (relativeSpeed < 0) {
            a.vx += relativeSpeed * nx; a.vy += relativeSpeed * ny;
            b.vx -= relativeSpeed * nx; b.vy -= relativeSpeed * ny;
          }
          if (now - a.lastBump > 520 && now - b.lastBump > 520) {
            a.lastBump = b.lastBump = now;
            a.speechUntil = b.speechUntil = now + 650;
            a.speech = b.speech = '어이쿠.';
          }
        }
      }
    }
    function drawPerson(person, now) {
      const wobble = person.startled * Math.sin(now / 42) * 3;
      ctx.save();
      ctx.translate(person.x, person.y + wobble);
      ctx.rotate(person.angle);
      const scale = person.r / 47;
      ctx.scale(scale, scale);
      // soft rolling shadow
      ctx.save(); ctx.rotate(-person.angle); ctx.translate(0, 64);
      ctx.fillStyle = 'rgba(75, 55, 38, .15)'; ctx.beginPath(); ctx.ellipse(0, 0, 37.6, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      // round body
      ctx.fillStyle = person.color; ctx.beginPath(); ctx.arc(0, 0, 47, 0, Math.PI * 2); ctx.fill();
      // clothing stripe makes the roll visible
      ctx.strokeStyle = '#d05243'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(0, 0, 35, -.35, 1.3); ctx.stroke();
      // face
      ctx.fillStyle = '#f4c49e'; ctx.beginPath(); ctx.arc(0, -9, 27, 0, Math.PI * 2); ctx.fill();
      // Same person, with only a small hairstyle variation.
      ctx.fillStyle = '#3e352f'; ctx.strokeStyle = '#3e352f'; ctx.lineCap = 'round';
      if (person.hair === 0) {
        ctx.beginPath(); ctx.arc(0, -12, 28, Math.PI, Math.PI * 2); ctx.lineTo(25, -10); ctx.quadraticCurveTo(0, -25, -25, -10); ctx.fill();
      } else if (person.hair === 1) {
        ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-21, -15); ctx.lineTo(-13, -35); ctx.lineTo(-4, -21); ctx.lineTo(5, -38); ctx.lineTo(13, -20); ctx.lineTo(23, -33); ctx.stroke();
      } else if (person.hair === 2) {
        ctx.beginPath(); ctx.arc(0, -13, 27, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(27, -12, 10, 0, Math.PI * 2); ctx.fill();
      } else if (person.hair === 3) {
        ctx.beginPath(); ctx.arc(0, -13, 27, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillRect(-24, -18, 48, 8);
      } else {
        ctx.beginPath(); ctx.arc(0, -13, 27, Math.PI, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-28, -13, 9, 0, Math.PI * 2); ctx.arc(28, -13, 9, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#3e352f'; ctx.beginPath(); ctx.arc(-9, -13, 2.8, 0, Math.PI * 2); ctx.arc(9, -13, 2.8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3e352f'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, -4, 9, .12, Math.PI - .12); ctx.stroke();
      // limbs
      ctx.strokeStyle = '#f4c49e'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-29, 10); ctx.lineTo(-43, 23); ctx.moveTo(29, 10); ctx.lineTo(43, 23); ctx.stroke();
      ctx.strokeStyle = '#3e352f'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(-16, 33); ctx.lineTo(-27, 43); ctx.moveTo(16, 33); ctx.lineTo(27, 43); ctx.stroke();
      ctx.restore();
      if (now < person.speechUntil) {
        const a = Math.min(1, (person.speechUntil - now) / 120);
        ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.4); ctx.translate(person.x, person.y - person.r - 34);
        ctx.font = '700 18px system-ui, sans-serif'; const label = person.speech; const bubbleWidth = ctx.measureText(label).width + 26;
        ctx.fillStyle = '#fffdf8'; ctx.beginPath(); ctx.roundRect(-bubbleWidth / 2, -18, bubbleWidth, 35, 17); ctx.fill();
        ctx.fillStyle = '#3e352f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, 0, 0); ctx.restore();
      }
    }
    function frame(now) {
      const dt = Math.min(2.2, (now - last) / 16.67); last = now;
      ctx.clearRect(0, 0, width, height);
      const bg = ctx.createRadialGradient(width * .5, height * .42, 20, width * .5, height * .5, Math.max(width, height));
      bg.addColorStop(0, '#fffaf1'); bg.addColorStop(1, '#eadcca'); ctx.fillStyle = bg; ctx.fillRect(0, 0, width, height);
      people.forEach(person => {
        hit(person, now);
        if (now >= person.pausedUntil) {
          person.startled = Math.max(0, person.startled - .05 * dt);
          person.x += person.vx * dt; person.y += person.vy * dt;
          person.angle += Math.hypot(person.vx, person.vy) * .035 * dt;
          if (person.x < person.r || person.x > width - person.r) { person.vx *= -1; person.x = Math.max(person.r, Math.min(width - person.r, person.x)); }
          if (person.y < person.r || person.y > height - person.r) { person.vy *= -1; person.y = Math.max(person.r, Math.min(height - person.r, person.y)); }
        }
      });
      collidePeople(now);
      people.forEach(person => drawPerson(person, now));
      if (pointer.active) { ctx.strokeStyle = 'rgba(62,53,47,.45)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 8, 0, Math.PI * 2); ctx.stroke(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
